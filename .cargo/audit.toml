[advisories]
# `rsa` is pulled in by `openidconnect` for AuthGate ID-token signature
# verification. NoteGate does not perform network-observable private-key RSA
# operations, which are the vulnerable path, and upstream has no patched
# release yet: https://rustsec.org/advisories/RUSTSEC-2023-0071
ignore = ["RUSTSEC-2023-0071"]
