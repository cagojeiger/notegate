  browser-api:
    permissions:
      contents: read
      actions: read
    name: Browser API
    needs: [gate, hygiene, rust-build, web]
    if: ${{ !cancelled() && needs.hygiene.result == 'success' && needs.hygiene.outputs.browser == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notegate
          POSTGRES_PASSWORD: notegate
          POSTGRES_DB: notegate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notegate -d notegate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NOTEGATE_DATABASE_URL: postgres://notegate:notegate@localhost:5432/notegate
      NOTEGATE_OIDC__ISSUER: https://authgate.project-jelly.io
      NOTEGATE_OIDC__CLIENT_ID: notegate-web
      NOTEGATE_PUBLIC_URL: http://localhost:9191
      NOTEGATE_CLI_OAUTH_CLIENT_ID: notegate-cli-local
      NOTEGATE_ENC_ROOT_KEY_ID: e2e-enc
      NOTEGATE_ENC_ROOT_SECRET: e2e-distinct-enc-root-secret-32-bytes
      NOTEGATE_LOOKUP_ROOT_KEY_ID: e2e-lookup
      NOTEGATE_LOOKUP_ROOT_SECRET: e2e-distinct-lookup-root-secret-32b
      NOTEGATE_S3__ENDPOINT: http://127.0.0.1:9000
      NOTEGATE_S3__PUBLIC_ENDPOINT: http://127.0.0.1:9000
      NOTEGATE_S3__REGION: us-east-1
      NOTEGATE_S3__BUCKET: notegate-e2e
      NOTEGATE_S3__ACCESS_KEY: notegate-app
      NOTEGATE_S3__SECRET_KEY: notegate-app-secret
      NOTEGATE_S3__FORCE_PATH_STYLE: "true"

    steps:
      - name: Require successful browser inputs
        working-directory: ${{ github.workspace }}
        env:
          RUST_BUILD_RESULT: ${{ needs.rust-build.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: test "$RUST_BUILD_RESULT" = success && test "$WEB_RESULT" = success

      - name: Create scoped core metadata token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read

      - name: Checkout trusted private CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          ref: 71c98dd45852f3174ca9a5b9fff1066c7deec98e
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Validate current public CI worker
        id: worker
        uses: ./.control/.github/actions/ci-worker-entry
        with:
          request: ${{ inputs.request }}
          kind: ci
          source-sha: ${{ needs.gate.outputs.tested_sha }}
          core-token: ${{ steps.core-token.outputs.token }}

      - name: Checkout exact core source
        uses: ./.control/.github/actions/checkout-core
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          sha: ${{ needs.gate.outputs.tested_sha }}
          path: source
          fetch-depth: 1

      - name: Download API and seed executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-e2e-api
          path: source/target/ci-artifacts

      - name: Restore API and seed executable
        shell: private_run.sh {0}
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_browser_api_restore_bundle.sh"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: source/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: source/.node-version
          package-manager-cache: false

      - name: Install dependencies
        shell: private_run.sh {0}
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        shell: private_run.sh {0}
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Download production frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: source/frontend/web/dist

      - name: Start MinIO
        env:
          MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:5173
          NOTEGATE_S3_BUCKET: ${{ env.NOTEGATE_S3__BUCKET }}
          NOTEGATE_S3_ACCESS_KEY: ${{ env.NOTEGATE_S3__ACCESS_KEY }}
          NOTEGATE_S3_SECRET_KEY: ${{ env.NOTEGATE_S3__SECRET_KEY }}
        shell: private_run.sh {0}
        run: bash deploy/ci/start-minio.sh

      - name: Seed test identities
        id: seed_test_identity
        shell: bash
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_seed_test_identity.sh"

      - name: Start application
        env:
          NOTEGATE_METRICS_ENABLED: "true"
          NOTEGATE_WEB_DIST_DIR: ${{ github.workspace }}/source/frontend/web/dist
        shell: private_run.sh {0}
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_browser_api_start.sh"

      - name: Test public V2 API
        env:
          NOTEGATE_PUBLIC_V2_API_KEY: ${{ steps.seed_test_identity.outputs.agent_api_key }}
          NOTEGATE_BROWSER_SESSION: ${{ steps.seed_test_identity.outputs.browser_session }}
          REDOCLY_TELEMETRY: "off"
          REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
        shell: private_run.sh {0}
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_browser_api_public_v2.sh"

      - name: Check API concurrency and latency smoke budgets
        timeout-minutes: 2
        shell: private_run.sh {0}
        env:
          NOTEGATE_PUBLIC_V2_API_KEY: ${{ steps.seed_test_identity.outputs.agent_api_key }}
          NOTEGATE_BROWSER_SESSION: ${{ steps.seed_test_identity.outputs.browser_session }}
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_browser_api_latency_smoke.sh"

      - name: Upload API latency diagnostics
        if: ${{ steps.worker.outcome == 'success' && (always() && !cancelled()) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-load-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: source/browser-e2e/api-load-*

      - name: Test browser API workflows
        id: browser_tests
        env:
          NOTEGATE_WEB_E2E_BROWSER_SESSION: ${{ steps.seed_test_identity.outputs.browser_session }}
          NOTEGATE_WEB_E2E_API_KEY: ${{ steps.seed_test_identity.outputs.agent_api_key }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/browser-api-test-results.json
        shell: private_run.sh {0}
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_browser_api_test.sh"

      - name: Collect browser API test timings
        id: browser_timings
        if: ${{ steps.worker.outcome == 'success' && (!cancelled() && (steps.browser_tests.outcome == 'success' || steps.browser_tests.outcome == 'failure')) }}
        shell: private_run.sh {0}
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_browser_api_timings.sh"

      - name: Retain browser API test timings
        if: ${{ steps.worker.outcome == 'success' && (!cancelled() && steps.browser_timings.outcome == 'success') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-api-test-timings
          path: source/browser-e2e/browser-test-timings.json
          if-no-files-found: error
          retention-days: 7

      - name: Seed live workbench identity
        id: workbench_identity
        shell: bash
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_seed_workbench_identity.sh"

      - name: Test live workbench contracts
        env:
          NOTEGATE_WEB_BASE_URL: http://localhost:9191
          NOTEGATE_WEB_E2E_BROWSER_SESSION: ${{ steps.workbench_identity.outputs.browser_session }}
          NOTEGATE_PUBLIC_V2_API_KEY: ${{ steps.workbench_identity.outputs.agent_api_key }}
        shell: private_run.sh {0}
        run: pnpm --filter web exec playwright test --config playwright.functional.config.ts --project workbench

      - name: Seed standalone OAuth identity
        id: oauth_identity
        shell: bash
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_seed_oauth_identity.sh"

      - name: Test standalone OAuth contracts
        env:
          NOTEGATE_OAUTH_BASE_URL: http://localhost:9191
          NOTEGATE_WEB_E2E_OAUTH_BROWSER_SESSION: ${{ steps.oauth_identity.outputs.browser_session }}
          NOTEGATE_WEB_E2E_OAUTH_CONSENT: ${{ steps.oauth_identity.outputs.oauth_consent }}
        shell: private_run.sh {0}
        run: pnpm --filter web exec playwright test --config playwright.functional.config.ts --project standalone-oauth

      - name: Upload authentication API screenshots
        if: ${{ steps.worker.outcome == 'success' && (always()) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: authentication-api
          if-no-files-found: ignore
          retention-days: 7
          path: source/frontend/web/test-results/browser-functional/oauth-*.png

