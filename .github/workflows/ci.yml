name: CI
run-name: Core ci ${{ fromJSON(inputs.request).run_id }}.${{ fromJSON(inputs.request).attempt }} ${{ fromJSON(inputs.request).tested_sha }}

on:
  workflow_dispatch:
    inputs:
      request:
        description: Validated core workflow run and immutable source request
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: core-ci-${{ fromJSON(inputs.request).run_id }}-${{ fromJSON(inputs.request).attempt }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  DOCKER_BUILD_SUMMARY: "false"

jobs:
  gate:
    name: Validate core request
    permissions:
      contents: read
      actions: read
    if: github.repository == 'cagojeiger/notegate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested_sha: ${{ steps.request.outputs.tested_sha }}
      source_event: ${{ steps.request.outputs.source_event }}
      head_sha: ${{ steps.request.outputs.head_sha }}
      base_sha: ${{ steps.request.outputs.base_sha }}
      pr_number: ${{ steps.request.outputs.pr_number }}
      run_id: ${{ steps.request.outputs.run_id }}
      attempt: ${{ steps.request.outputs.attempt }}
      base_ref: ${{ steps.request.outputs.base_ref }}
      web_artifact_run_id: ${{ steps.request.outputs.web_artifact_run_id }}
      rust_build: ${{ steps.request.outputs.rust_build }}
      rust: ${{ steps.request.outputs.rust }}
      web: ${{ steps.request.outputs.web }}
      browser: ${{ steps.request.outputs.browser }}
      postgres: ${{ steps.request.outputs.postgres }}
      image: ${{ steps.request.outputs.image }}
      impact_scope: ${{ steps.request.outputs.impact_scope }}
      impact_reason: ${{ steps.request.outputs.impact_reason }}

    steps:
      - name: Create scoped core metadata token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read

      - name: Checkout trusted private CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          ref: 71c98dd45852f3174ca9a5b9fff1066c7deec98e
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Validate immutable core request
        id: request
        env:
          REQUEST_JSON: ${{ inputs.request }}
          GH_TOKEN: ${{ github.token }}
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
        run: python3 .control/.github/scripts/ci_bridge.py gate --kind ci >> "$GITHUB_OUTPUT"

      - name: Revoke gate metadata token
        if: ${{ always() && steps.core-token.outputs.token != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
        run: bash .control/.github/scripts/checkout_core_revoke.sh

  security:
    permissions:
      contents: read
      actions: read
    needs: gate
    name: Source Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Create scoped core metadata token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read

      - name: Checkout trusted private CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          ref: 71c98dd45852f3174ca9a5b9fff1066c7deec98e
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Validate current public CI worker
        id: worker
        uses: ./.control/.github/actions/ci-worker-entry
        with:
          request: ${{ inputs.request }}
          kind: ci
          source-sha: ${{ needs.gate.outputs.tested_sha }}
          core-token: ${{ steps.core-token.outputs.token }}

      - name: Checkout public workflow metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate
          ref: ${{ github.sha }}
          token: ${{ github.token }}
          path: .public-control
          persist-credentials: false

      - name: Set up pinned local scanners
        uses: ./.control/.github/actions/setup-security-scanners

      - name: Checkout exact core source
        uses: ./.control/.github/actions/checkout-core
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          sha: ${{ needs.gate.outputs.tested_sha }}
          path: source

      - name: Validate public CI contracts with private control
        shell: private_run.sh {0}
        working-directory: ${{ github.workspace }}
        run: |
          python3 "$GITHUB_WORKSPACE/.control/.github/scripts/check_public_ci.py" \
            --public-root "$GITHUB_WORKSPACE/.public-control" \
            --private-control-root "$GITHUB_WORKSPACE/.control"

      - name: Verify pinned scanner compatibility
        shell: private_run.sh {0}
        working-directory: ${{ github.workspace }}
        run: bash "$GITHUB_WORKSPACE/.control/.github/scripts/ci_scanner_smoke.sh"

      - name: Verify private-output shell behavior
        shell: private_run.sh {0}
        working-directory: ${{ github.workspace }}
        run: bash "$GITHUB_WORKSPACE/.control/.github/scripts/ci_private_shell_smoke.sh"

      - name: Check source security without publishing source diagnostics
        shell: bash
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_source_security.sh"

  hygiene:
    permissions:
      contents: read
      actions: read
    needs: gate
    name: Hygiene
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    outputs:
      rust_build: ${{ steps.impact.outputs.rust_build }}
      rust: ${{ steps.impact.outputs.rust }}
      web: ${{ steps.impact.outputs.web }}
      browser: ${{ steps.impact.outputs.browser }}
      postgres: ${{ steps.impact.outputs.postgres }}
      image: ${{ steps.impact.outputs.image }}

    steps:
      - name: Create scoped core metadata token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read

      - name: Checkout trusted private CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          ref: 71c98dd45852f3174ca9a5b9fff1066c7deec98e
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Validate current public CI worker
        id: worker
        uses: ./.control/.github/actions/ci-worker-entry
        with:
          request: ${{ inputs.request }}
          kind: ci
          source-sha: ${{ needs.gate.outputs.tested_sha }}
          core-token: ${{ steps.core-token.outputs.token }}

      - name: Checkout exact core source
        uses: ./.control/.github/actions/checkout-core
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          sha: ${{ needs.gate.outputs.tested_sha }}
          path: source
          fetch-depth: 2

      - name: Select CI checks
        id: impact
        env:
          RUST_BUILD: ${{ needs.gate.outputs.rust_build }}
          RUST: ${{ needs.gate.outputs.rust }}
          WEB: ${{ needs.gate.outputs.web }}
          BROWSER: ${{ needs.gate.outputs.browser }}
          POSTGRES: ${{ needs.gate.outputs.postgres }}
          IMAGE: ${{ needs.gate.outputs.image }}
          IMPACT_SCOPE: ${{ needs.gate.outputs.impact_scope }}
          IMPACT_REASON: ${{ needs.gate.outputs.impact_reason }}
        shell: private_run.sh {0}
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_hygiene_impact.sh"

      - name: Install actionlint
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        shell: private_run.sh {0}
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_hygiene_install_actionlint.sh"

      - name: Workflow checks
        shell: private_run.sh {0}
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_hygiene_workflow_check.sh"

      - name: Format
        shell: private_run.sh {0}
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_hygiene_fmt.sh"

      - name: Diff check
        shell: private_run.sh {0}
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_hygiene_diff.sh"

  rust-build:
    permissions:
      contents: read
      actions: read
    name: Rust Build
    needs: [gate, hygiene]
    if: needs.hygiene.outputs.rust_build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    timeout-minutes: 25
    steps:
      - name: Create scoped core metadata token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read

      - name: Checkout trusted private CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          ref: 71c98dd45852f3174ca9a5b9fff1066c7deec98e
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Validate current public CI worker
        id: worker
        uses: ./.control/.github/actions/ci-worker-entry
        with:
          request: ${{ inputs.request }}
          kind: ci
          source-sha: ${{ needs.gate.outputs.tested_sha }}
          core-token: ${{ steps.core-token.outputs.token }}

      - name: Checkout exact core source
        uses: ./.control/.github/actions/checkout-core
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          sha: ${{ needs.gate.outputs.tested_sha }}
          path: source
          fetch-depth: 1

      - name: Check
        if: needs.hygiene.outputs.rust == 'true'
        shell: private_run.sh {0}
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_rust_build_check.sh"

      - name: Clippy
        if: needs.hygiene.outputs.rust == 'true'
        shell: private_run.sh {0}
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_rust_build_clippy.sh"

      - name: Prepare Rust tests and doctests
        if: needs.hygiene.outputs.rust == 'true'
        shell: private_run.sh {0}
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_rust_build_prepare_tests.sh"

      - name: Build API and seed executable
        shell: private_run.sh {0}
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_rust_build_api.sh"

      - name: Package API and seed executable
        shell: private_run.sh {0}
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_rust_build_package_api.sh"

      - name: Report prepared bundle sizes
        shell: private_run.sh {0}
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_rust_build_report_bundles.sh"

      - name: Compress prepared bundles
        shell: private_run.sh {0}
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_rust_build_compress_bundles.sh"

      - name: Retain prepared Rust tests
        if: needs.hygiene.outputs.rust == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-prepared-tests
          path: source/target/ci-artifacts/rust-tests.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Retain API and seed executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-e2e-api
          path: source/target/ci-artifacts/api.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  rust:
    permissions:
      contents: read
      actions: read
    name: Rust
    needs: [gate, hygiene, rust-build]
    if: ${{ !cancelled() && needs.hygiene.result == 'success' && needs.hygiene.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notegate
          POSTGRES_PASSWORD: notegate
          POSTGRES_DB: notegate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notegate -d notegate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NOTEGATE_TEST_DATABASE_URL: postgres://notegate:notegate@localhost:5432/notegate
      NOTEGATE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      NOTEGATE_TEST_S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      NOTEGATE_TEST_S3_REGION: us-east-1
      NOTEGATE_TEST_S3_BUCKET: notegate-test
      NOTEGATE_TEST_S3_ACCESS_KEY: notegate-app
      NOTEGATE_TEST_S3_SECRET_KEY: notegate-app-secret

    steps:
      - name: Require successful Rust build
        working-directory: ${{ github.workspace }}
        env:
          BUILD_RESULT: ${{ needs.rust-build.result }}
        run: test "$BUILD_RESULT" = success

      - name: Create scoped core metadata token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read

      - name: Checkout trusted private CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          ref: 71c98dd45852f3174ca9a5b9fff1066c7deec98e
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Validate current public CI worker
        id: worker
        uses: ./.control/.github/actions/ci-worker-entry
        with:
          request: ${{ inputs.request }}
          kind: ci
          source-sha: ${{ needs.gate.outputs.tested_sha }}
          core-token: ${{ steps.core-token.outputs.token }}

      - name: Checkout exact core source
        uses: ./.control/.github/actions/checkout-core
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          sha: ${{ needs.gate.outputs.tested_sha }}
          path: source
          fetch-depth: 1

      - name: Download prepared Rust tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-prepared-tests
          path: source/target/ci-artifacts

      - name: Decompress prepared Rust tests
        shell: private_run.sh {0}
        run: zstd --decompress --rm target/ci-artifacts/rust-tests.tar.zst

      - name: Start MinIO
        env:
          NOTEGATE_S3_BUCKET: notegate-test
          NOTEGATE_S3_ACCESS_KEY: notegate-app
          NOTEGATE_S3_SECRET_KEY: notegate-app-secret
        shell: private_run.sh {0}
        run: bash deploy/ci/start-minio.sh

      - name: Test runner cleanup
        shell: private_run.sh {0}
        run: deploy/ci/test-rust.test.sh --postgres

      - name: Test without external services
        shell: private_run.sh {0}
        run: python3 deploy/ci/rust-test-suites.py self-contained --prepared target/ci-artifacts/rust-tests.tar --output target/test-suites/self-contained

      - name: Test with PostgreSQL and S3
        shell: private_run.sh {0}
        run: python3 deploy/ci/rust-test-suites.py external --prepared target/ci-artifacts/rust-tests.tar --output target/test-suites/external

      - name: Reject missing integration settings
        shell: private_run.sh {0}
        run: bash "$GITHUB_WORKSPACE/.control/.github/scripts/ci_rust_assert_integration_settings.sh"

      - name: Measure search date candidate filtering
        shell: private_run.sh {0}
        run: >-
          python3 deploy/ci/rust-test-suites.py exact --prepared target/ci-artifacts/rust-tests.tar
          --package notegate-service --target-kind test --target search
          --test-name search_date_filters_measure_candidate_work
          --output target/test-suites/measure-search -- --ignored --show-output

      - name: Measure command completion and history capture
        shell: private_run.sh {0}
        run: bash "$GITHUB_WORKSPACE/.control/.github/scripts/ci_rust_measure_commands.sh"

  postgres18:
    permissions:
      contents: read
      actions: read
    name: PostgreSQL 18
    needs: [gate, hygiene]
    if: needs.hygiene.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: notegate-pg18-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PORT: "5433"
      NOTEGATE_TEST_DATABASE_URL: postgres://notegate:notegate@localhost:5433/notegate

    steps:
      - name: Create scoped core metadata token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read

      - name: Checkout trusted private CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          ref: 71c98dd45852f3174ca9a5b9fff1066c7deec98e
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Validate current public CI worker
        id: worker
        uses: ./.control/.github/actions/ci-worker-entry
        with:
          request: ${{ inputs.request }}
          kind: ci
          source-sha: ${{ needs.gate.outputs.tested_sha }}
          core-token: ${{ steps.core-token.outputs.token }}

      - name: Checkout exact core source
        uses: ./.control/.github/actions/checkout-core
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          sha: ${{ needs.gate.outputs.tested_sha }}
          path: source
          fetch-depth: 1

      - name: Prepare Compose environment
        shell: private_run.sh {0}
        run: cp .env.example .env

      - name: Verify PostgreSQL volume upgrade and persistence
        shell: private_run.sh {0}
        run: bash deploy/ci/postgres-upgrade-smoke.sh

      - name: Test database migrations and repositories on PostgreSQL 18
        shell: private_run.sh {0}
        run: cargo test --locked -p notegate-db --tests

      - name: Stop Compose
        if: ${{ steps.worker.outcome == 'success' && (always()) }}
        shell: private_run.sh {0}
        run: bash "$GITHUB_WORKSPACE/.control/.github/scripts/ci_postgres_cleanup.sh"

  rust-audit:
    permissions:
      contents: read
      actions: read
    needs: gate
    name: Main RustSec Audit
    if: needs.gate.outputs.source_event == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source

    steps:
      - name: Create scoped core metadata token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read

      - name: Checkout trusted private CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          ref: 71c98dd45852f3174ca9a5b9fff1066c7deec98e
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Validate current public CI worker
        id: worker
        uses: ./.control/.github/actions/ci-worker-entry
        with:
          request: ${{ inputs.request }}
          kind: ci
          source-sha: ${{ needs.gate.outputs.tested_sha }}
          core-token: ${{ steps.core-token.outputs.token }}

      - name: Checkout exact core source
        uses: ./.control/.github/actions/checkout-core
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          sha: ${{ needs.gate.outputs.tested_sha }}
          path: source
          fetch-depth: 1

      - name: Install cargo-audit
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Audit Rust dependencies
        shell: private_run.sh {0}
        run: cargo audit --deny yanked

  web:
    permissions:
      contents: read
      actions: read
    name: Web
    needs: [gate, hygiene]
    if: needs.hygiene.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source

    steps:
      - name: Create scoped core metadata token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read

      - name: Checkout trusted private CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          ref: 71c98dd45852f3174ca9a5b9fff1066c7deec98e
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Validate current public CI worker
        id: worker
        uses: ./.control/.github/actions/ci-worker-entry
        with:
          request: ${{ inputs.request }}
          kind: ci
          source-sha: ${{ needs.gate.outputs.tested_sha }}
          core-token: ${{ steps.core-token.outputs.token }}

      - name: Checkout exact core source
        uses: ./.control/.github/actions/checkout-core
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          sha: ${{ needs.gate.outputs.tested_sha }}
          path: source
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: source/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: source/.node-version
          package-manager-cache: false

      - name: Install dependencies
        shell: private_run.sh {0}
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        shell: private_run.sh {0}
        run: pnpm audit --audit-level moderate

      - name: Check theme contrast
        shell: private_run.sh {0}
        run: pnpm --filter web check:contrast

      - name: Typecheck
        shell: private_run.sh {0}
        run: pnpm --filter web typecheck

      - name: Lint
        shell: private_run.sh {0}
        run: pnpm --filter web lint

      - name: Test
        shell: private_run.sh {0}
        run: pnpm --filter web test

      - name: Build
        shell: private_run.sh {0}
        run: pnpm --filter web build

      - name: Check production bundle budgets
        shell: private_run.sh {0}
        run: pnpm --filter web check:preview-bundle

      - name: Retain production frontend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: source/frontend/web/dist/
