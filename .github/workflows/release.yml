name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  version:
    name: Resolve version
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      should_release: ${{ steps.ver.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Resolve release version
        id: ver
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          CURRENT_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)" \
            deploy/ci/resolve-release-version.sh

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    if: ${{ needs.version.outputs.should_release == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=notegate-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=notegate-release-${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$digest" > "/tmp/digests/${{ matrix.arch }}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  scan:
    name: Trivy image gate linux/${{ matrix.arch }}
    needs: [version, build]
    if: ${{ needs.version.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Download image digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests

      - name: Select immutable image
        id: image
        run: |
          digest="$(cat "/tmp/digests/${{ matrix.arch }}")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ref=${REGISTRY}/${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Scanning ${REGISTRY}/${IMAGE}@${digest} (linux/${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Report high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
          TRIVY_IMAGE_SRC: remote
        with:
          version: v0.74.0
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: trivy-linux-${{ matrix.arch }}.json
          exit-code: "0"
          ignore-unfixed: false
          timeout: 10m

      - name: Prepare SARIF and summary
        run: |
          trivy convert --format sarif --output "trivy-linux-${{ matrix.arch }}.sarif" "trivy-linux-${{ matrix.arch }}.json"
          {
            echo '### HIGH and CRITICAL findings, including unfixed'
            jq -r '[.Results[]?.Vulnerabilities[]?] | group_by(.Severity)[] | "- \(.[0].Severity): \(length)"' "trivy-linux-${{ matrix.arch }}.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain scan evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-trivy-${{ matrix.arch }}
          path: |
            trivy-linux-${{ matrix.arch }}.json
            trivy-linux-${{ matrix.arch }}.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Publish security findings
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-linux-${{ matrix.arch }}.sarif
          category: trivy-release-linux-${{ matrix.arch }}

      - name: Block fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
          TRIVY_IMAGE_SRC: remote
        with:
          version: v0.74.0
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: vuln
          severity: CRITICAL
          format: table
          ignore-unfixed: true
          exit-code: "1"
          timeout: 10m

  cli:
    name: Build CLI ${{ matrix.target }}
    needs: version
    if: ${{ needs.version.outputs.should_release == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build notegate-cli
        run: cargo build --locked --release -p notegate-cli --target ${{ matrix.target }}

      - name: Smoke test notegate-cli
        shell: bash
        run: |
          set -euo pipefail
          expected="notegate-cli ${{ needs.version.outputs.version }}"
          actual="$(target/${{ matrix.target }}/release/notegate-cli --version)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::expected '${expected}', got '${actual}'"
            exit 1
          fi

      - name: Package notegate-cli
        shell: bash
        run: |
          set -euo pipefail
          asset="notegate-cli-${{ matrix.target }}"
          mkdir -p /tmp/cli-assets
          cp "target/${{ matrix.target }}/release/notegate-cli" "/tmp/cli-assets/${asset}"
          chmod 755 "/tmp/cli-assets/${asset}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "/tmp/cli-assets/${asset}" | awk '{print $1}' > "/tmp/cli-assets/${asset}.sha256"
          else
            shasum -a 256 "/tmp/cli-assets/${asset}" | awk '{print $1}' > "/tmp/cli-assets/${asset}.sha256"
          fi

      - name: Upload CLI asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: /tmp/cli-assets/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: [version, build, scan, cli]
    if: ${{ needs.version.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Download CLI assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/cli-assets
          pattern: cli-*
          merge-multiple: true

      - name: Download image scan reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/scan-reports
          pattern: release-trivy-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          images=()
          for arch in amd64 arm64; do
            digest="$(cat "$arch")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            images+=("${REGISTRY}/${IMAGE}@${digest}")
          done
          docker buildx imagetools create \
            -t "${REGISTRY}/${IMAGE}:${version}" \
            -t "${REGISTRY}/${IMAGE}:latest" \
            "${images[@]}"

      - name: Inspect manifest
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          image="${REGISTRY}/${IMAGE}"
          manifest="$(docker buildx imagetools inspect "${image}:${version}" --format '{{json .Manifest}}')"
          index_digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$manifest")"
          for arch in amd64 arm64; do
            scanned_digest="$(cat "/tmp/digests/${arch}")"
            scanned_manifest="$(docker buildx imagetools inspect "${image}@${scanned_digest}" --format '{{json .Manifest}}')"
            test "$(jq -er '.digest' <<< "$scanned_manifest")" = "$scanned_digest"
            expected="$(jq -er --arg arch "$arch" '
              if .manifests then
                [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest]
                | if length == 1 then .[0] else empty end
              else .digest end
            ' <<< "$scanned_manifest")"
            actual="$(jq -er --arg arch "$arch" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest]
              | if length == 1 then .[0] else empty end
            ' <<< "$manifest")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::${arch} release digest $actual does not match scanned image digest $expected"
              exit 1
            fi
          done
          latest_digest="$(docker buildx imagetools inspect "${image}:latest" --format '{{json .Manifest}}' | jq -er '.digest')"
          test "$latest_digest" = "$index_digest"
          mkdir -p /tmp/cli-release
          jq -n \
            --arg version "$version" \
            --arg source_sha "$RELEASE_SHA" \
            --arg image "$image" \
            --arg index_digest "$index_digest" \
            --arg amd64 "$(cat /tmp/digests/amd64)" \
            --arg arm64 "$(cat /tmp/digests/arm64)" \
            '{schema_version: 1, version: $version, source_sha: $source_sha, image: $image, index_digest: $index_digest, architectures: {amd64: $amd64, arm64: $arm64}}' \
            > /tmp/cli-release/image-digests.json
          cp /tmp/scan-reports/trivy-linux-{amd64,arm64}.json /tmp/cli-release/
          echo "Published ${image}@${index_digest} after both image gates passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare CLI release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          source_dir="/tmp/cli-assets"
          release_dir="/tmp/cli-release"
          mkdir -p "$release_dir"
          targets=(
            "x86_64-unknown-linux-gnu"
            "aarch64-unknown-linux-gnu"
            "x86_64-apple-darwin"
            "aarch64-apple-darwin"
          )
          manifest_tmp="${release_dir}/notegate-cli-manifest.json.tmp"
          {
            printf '{\n'
            printf '  "schema_version": 1,\n'
            printf '  "version": "%s",\n' "$version"
            printf '  "repository": "%s",\n' "${GITHUB_REPOSITORY}"
            printf '  "assets": {\n'
          } > "$manifest_tmp"
          first=1
          for target in "${targets[@]}"; do
            asset="notegate-cli-${target}"
            if [ ! -s "${source_dir}/${asset}" ]; then
              echo "::error::missing CLI asset ${asset}"
              exit 1
            fi
            if [ ! -s "${source_dir}/${asset}.sha256" ]; then
              echo "::error::missing CLI checksum ${asset}.sha256"
              exit 1
            fi
            cp "${source_dir}/${asset}" "${release_dir}/${asset}"
            cp "${source_dir}/${asset}.sha256" "${release_dir}/${asset}.sha256"
            size=$(stat -c%s "${release_dir}/${asset}")
            sha=$(awk '{print $1}' "${release_dir}/${asset}.sha256")
            actual_sha=$(sha256sum "${release_dir}/${asset}" | awk '{print $1}')
            if [ "${#sha}" -ne 64 ] || [ "$sha" != "$actual_sha" ]; then
              echo "::error::invalid CLI checksum for ${asset}"
              exit 1
            fi
            if [ "$first" -eq 0 ]; then
              printf ',\n' >> "$manifest_tmp"
            fi
            first=0
            printf '    "%s": {"name": "%s", "sha256": "%s", "size": %s}' \
              "$target" "$asset" "$sha" "$size" >> "$manifest_tmp"
          done
          {
            printf '\n  }\n'
            printf '}\n'
          } >> "$manifest_tmp"
          mv "$manifest_tmp" "${release_dir}/notegate-cli-manifest.json"
          python3 -m json.tool "${release_dir}/notegate-cli-manifest.json" >/dev/null
          cp deploy/cli/install.sh "${release_dir}/notegate-cli-installer.sh"
          chmod 755 "${release_dir}/notegate-cli-installer.sh"

      - name: Create or resume GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" /tmp/cli-release/* --clobber
          else
            gh release create "$tag" \
              --target "$RELEASE_SHA" \
              --title "$tag" \
              --generate-notes \
              /tmp/cli-release/*
          fi
