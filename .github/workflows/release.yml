name: Release

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Annotated release tag on notegate-core (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      source_sha:
        description: Full 40-character source commit SHA identified by the core tag
        required: true
        type: string
      source_ci_run_id:
        description: Successful core main push CI run for this source commit
        required: true
        type: string
      publish:
        description: Build the image, scan it, and publish the CLI (false checks the plan)
        required: true
        default: false
        type: boolean

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: cagojeiger/notegate-private
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  DOCKER_BUILD_SUMMARY: "false"

jobs:
  version:
    name: Validate source and release plan
    if: github.repository == 'cagojeiger/notegate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      ci_run_id: ${{ steps.plan.outputs.ci_run_id }}
      tag_object_sha: ${{ steps.plan.outputs.tag_object_sha }}
      notes_sha256: ${{ steps.plan.outputs.notes_sha256 }}
      should_release: ${{ steps.plan.outputs.should_release }}
    steps:
      - name: Create short-lived core read token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read
          permission-actions: read

      - name: Checkout trusted private Release control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          ref: d65e94032bd9354b2694e17ae4865640583a6c91
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Check exact source, CI, and release version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          PUBLISH: ${{ inputs.publish }}
        run: python3 "$GITHUB_WORKSPACE/.control/.github/scripts/release_gate.py" >> "$GITHUB_OUTPUT"

      - name: Revoke Release control token
        if: ${{ always() && steps.core-token.outputs.token != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
        run: bash .control/.github/scripts/checkout_core_revoke.sh

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    outputs:
      amd64: ${{ steps.digest.outputs.amd64 }}
      arm64: ${{ steps.digest.outputs.arm64 }}
    if: needs.version.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Create short-lived core read token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read

      - name: Checkout trusted private Release control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          ref: d65e94032bd9354b2694e17ae4865640583a6c91
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Revoke Release control token
        if: ${{ always() && steps.core-token.outputs.token != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
        run: bash .control/.github/scripts/checkout_core_revoke.sh

      - name: Checkout exact core source
        uses: ./.control/.github/actions/checkout-core
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          sha: ${{ needs.version.outputs.source_sha }}
          path: source

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        working-directory: source
        env:
          PLATFORM: ${{ matrix.platform }}
        shell: private_run.sh {0}
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_release_build_image.sh"

      - name: Export digest
        id: digest
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        shell: private_run.sh {0}
        run: printf '%s=%s\n' "$ARCH" "$BUILD_DIGEST" >> "$GITHUB_OUTPUT"

  scan:
    name: Trivy image gate linux/${{ matrix.arch }}
    needs: [version, build]
    if: needs.version.outputs.should_release == 'true'
    outputs:
      amd64: ${{ steps.scan.outputs.amd64 }}
      arm64: ${{ steps.scan.outputs.arm64 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Create short-lived core read token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read

      - name: Checkout trusted private Release control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          ref: d65e94032bd9354b2694e17ae4865640583a6c91
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Revoke Release control token
        if: ${{ always() && steps.core-token.outputs.token != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
        run: bash .control/.github/scripts/checkout_core_revoke.sh

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install verified Trivy release
        shell: bash
        run: |
          trivy_dir="$RUNNER_TEMP/trivy-release"
          mkdir -p "$trivy_dir"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            --output "$trivy_dir/trivy.tar.gz" \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  $trivy_dir/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$trivy_dir/trivy.tar.gz" -C "$trivy_dir" trivy
          "$trivy_dir/trivy" --version
          echo "$trivy_dir" >> "$GITHUB_PATH"

      - name: Validate the exact image and block fixable critical vulnerabilities
        id: scan
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          SCAN_DIGEST: ${{ needs.build.outputs[matrix.arch] }}
        run: |
          if [[ ! "$SCAN_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'The build did not return an image digest.' >&2
            exit 1
          fi
          image="$REGISTRY/$IMAGE@$SCAN_DIGEST"
          report="$RUNNER_TEMP/release-trivy.json"
          if ! trivy image --image-src remote --platform "linux/$ARCH" --scanners vuln \
              --severity HIGH,CRITICAL --format json --output "$report" --exit-code 0 \
              --ignore-unfixed=false --timeout 10m "$image" >"$RUNNER_TEMP/release-trivy.log" 2>&1; then
            echo 'The private image scan failed.' >&2
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/.control/.github/scripts/publish_release.py" --verify-scan "$report" "$image"
          printf '%s=%s\n' "$ARCH" "$SCAN_DIGEST" >> "$GITHUB_OUTPUT"

  cli:
    name: Build CLI ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    steps:
      - name: Create short-lived core read token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read

      - name: Checkout trusted private Release control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          ref: d65e94032bd9354b2694e17ae4865640583a6c91
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Revoke Release control token
        if: ${{ always() && steps.core-token.outputs.token != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
        run: bash .control/.github/scripts/checkout_core_revoke.sh

      - name: Checkout exact core source
        uses: ./.control/.github/actions/checkout-core
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          sha: ${{ needs.version.outputs.source_sha }}
          path: source

      - name: Add Rust target
        env:
          TARGET: ${{ matrix.target }}
        shell: private_run.sh {0}
        run: rustup target add "$TARGET"

      - name: Build notegate-cli
        working-directory: source
        env:
          TARGET: ${{ matrix.target }}
        shell: private_run.sh {0}
        run: cargo build --locked --release -p notegate-cli --target "$TARGET"

      - name: Smoke test and package notegate-cli
        working-directory: source
        shell: private_run.sh {0}
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: source "$GITHUB_WORKSPACE/.control/.github/scripts/ci_release_package_cli.sh"

      - name: Upload CLI assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: /tmp/cli-assets/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish verified release
    needs: [version, build, scan, cli]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - name: Create short-lived core read token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read
          permission-actions: read

      - name: Checkout trusted private Release control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          ref: d65e94032bd9354b2694e17ae4865640583a6c91
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Checkout installer data without executing core scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          token: ${{ steps.core-token.outputs.token }}
          ref: ${{ needs.version.outputs.source_sha }}
          path: source
          sparse-checkout: deploy/cli/install.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download Linux x64 CLI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-x86_64-unknown-linux-gnu
          path: /tmp/release-inputs/cli
      - name: Download Linux arm64 CLI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-aarch64-unknown-linux-gnu
          path: /tmp/release-inputs/cli
      - name: Download macOS x64 CLI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-x86_64-apple-darwin
          path: /tmp/release-inputs/cli
      - name: Download macOS arm64 CLI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-aarch64-apple-darwin
          path: /tmp/release-inputs/cli
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Validate, stage, verify, and publish approved assets
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
          SOURCE_TAG: ${{ needs.version.outputs.tag }}
          SOURCE_SHA: ${{ needs.version.outputs.source_sha }}
          SOURCE_CI_RUN_ID: ${{ needs.version.outputs.ci_run_id }}
          SOURCE_TAG_OBJECT_SHA: ${{ needs.version.outputs.tag_object_sha }}
          RELEASE_NOTES_SHA256: ${{ needs.version.outputs.notes_sha256 }}
          AMD64_DIGEST: ${{ needs.scan.outputs.amd64 }}
          ARM64_DIGEST: ${{ needs.scan.outputs.arm64 }}
          VERSION: ${{ needs.version.outputs.version }}
          PUBLISH: "true"
        run: python3 "$GITHUB_WORKSPACE/.control/.github/scripts/publish_release.py"

      - name: Revoke Release control token
        if: ${{ always() && steps.core-token.outputs.token != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
        run: bash .control/.github/scripts/checkout_core_revoke.sh
