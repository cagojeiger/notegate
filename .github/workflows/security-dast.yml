name: Security DAST Pilot
run-name: Core security-dast ${{ fromJSON(inputs.request).run_id }}.${{ fromJSON(inputs.request).attempt }} ${{ fromJSON(inputs.request).tested_sha }}

on:
  workflow_dispatch:
    inputs:
      request:
        description: Validated core workflow run and immutable source request
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: core-security-dast-${{ fromJSON(inputs.request).run_id }}-${{ fromJSON(inputs.request).attempt }}
  cancel-in-progress: false

jobs:
  gate:
    name: Validate core request
    permissions:
      contents: read
      actions: read
    if: github.repository == 'cagojeiger/notegate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested_sha: ${{ steps.request.outputs.tested_sha }}
      source_event: ${{ steps.request.outputs.source_event }}
      head_sha: ${{ steps.request.outputs.head_sha }}
      base_sha: ${{ steps.request.outputs.base_sha }}
      pr_number: ${{ steps.request.outputs.pr_number }}
      run_id: ${{ steps.request.outputs.run_id }}
      attempt: ${{ steps.request.outputs.attempt }}
      base_ref: ${{ steps.request.outputs.base_ref }}
      web_artifact_run_id: ${{ steps.request.outputs.web_artifact_run_id }}

    steps:
      - name: Checkout trusted public control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .control
          persist-credentials: false

      - name: Validate immutable core request
        id: request
        env:
          REQUEST_JSON: ${{ inputs.request }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .control/.github/scripts/ci_bridge.py gate --kind security-dast >> "$GITHUB_OUTPUT"

  pilot:
    needs: gate
    name: Isolated adversarial scenarios
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notegate
          POSTGRES_PASSWORD: notegate
          POSTGRES_DB: notegate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notegate -d notegate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SOURCE_SHA: ${{ needs.gate.outputs.tested_sha }}
      NOTEGATE_DATABASE_URL: postgres://notegate:notegate@localhost:5432/notegate
      NOTEGATE_OIDC__ISSUER: http://127.0.0.1:9192
      NOTEGATE_OIDC__CLIENT_ID: notegate-web
      NOTEGATE_PUBLIC_URL: http://127.0.0.1:9191
      NOTEGATE_BIND_ADDR: 0.0.0.0:9191
      NOTEGATE_CLI_OAUTH_CLIENT_ID: notegate-cli-local
      NOTEGATE_ENC_ROOT_KEY_ID: e2e-enc
      NOTEGATE_ENC_ROOT_SECRET: e2e-distinct-enc-root-secret-32-bytes
      NOTEGATE_LOOKUP_ROOT_KEY_ID: e2e-lookup
      NOTEGATE_LOOKUP_ROOT_SECRET: e2e-distinct-lookup-root-secret-32b
      NOTEGATE_S3__ENDPOINT: http://127.0.0.1:9000
      NOTEGATE_S3__PUBLIC_ENDPOINT: http://127.0.0.1:9000
      NOTEGATE_S3__REGION: us-east-1
      NOTEGATE_S3__BUCKET: notegate-e2e
      NOTEGATE_S3__ACCESS_KEY: notegate-app
      NOTEGATE_S3__SECRET_KEY: notegate-app-secret
      NOTEGATE_S3__FORCE_PATH_STYLE: "true"
      NOTEGATE_WEB_DIST_DIR: ${{ github.workspace }}/source/frontend/web/dist

    steps:
      - name: Checkout trusted public control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .control
          persist-credentials: false

      - name: Checkout exact public core source
        uses: ./.control/.github/actions/checkout-core
        with:
          sha: ${{ needs.gate.outputs.tested_sha }}
          path: source
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: source/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: source/.node-version
          package-manager-cache: false

      - name: Build application and browser probes
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm --filter web exec tsc -p tsconfig.e2e.json --noEmit
          pnpm --filter web build
          cargo build --locked --release --package notegate-api --bin notegate-api --example seed_user

      - name: Start disposable object storage
        env:
          NOTEGATE_S3_BUCKET: ${{ env.NOTEGATE_S3__BUCKET }}
          NOTEGATE_S3_ACCESS_KEY: ${{ env.NOTEGATE_S3__ACCESS_KEY }}
          NOTEGATE_S3_SECRET_KEY: ${{ env.NOTEGATE_S3__SECRET_KEY }}
        run: bash deploy/ci/start-minio.sh

      - name: Seed two disposable owners
        id: identity
        run: |
          for identity in A B; do
            output=$(target/release/examples/seed_user "dast-$identity")
            key=$(printf '%s\n' "$output" | sed -n 's/^AGENT_API_KEY=//p')
            session=$(printf '%s\n' "$output" | sed -n 's/^BROWSER_SESSION=//p')
            account=$(printf '%s\n' "$output" | sed -n 's/^ACCOUNT_ID=//p')
            test -n "$key" && test -n "$session" && test -n "$account"
            echo "::add-mask::$key"
            echo "::add-mask::$session"
            printf 'key_%s=%s\nsession_%s=%s\naccount_%s=%s\n' \
              "$identity" "$key" "$identity" "$session" "$identity" "$account" >> "$GITHUB_OUTPUT"
          done

      - name: Start disposable application
        id: app
        run: |
          target/release/notegate-api >"$RUNNER_TEMP/security-api.log" 2>&1 &
          api_pid=$!
          echo "$api_pid" >"$RUNNER_TEMP/security-api.pid"
          for _ in $(seq 1 60); do
            kill -0 "$api_pid" || { cat "$RUNNER_TEMP/security-api.log"; exit 1; }
            if curl --fail --silent http://127.0.0.1:9191/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/security-api.log"
          exit 1

      - name: Probe ownership and read-only permissions over HTTP
        id: api
        timeout-minutes: 5
        env:
          NOTEGATE_DAST_BROWSER_SESSION_A: ${{ steps.identity.outputs.session_A }}
          NOTEGATE_DAST_BROWSER_SESSION_B: ${{ steps.identity.outputs.session_B }}
          NOTEGATE_DAST_API_KEY_A: ${{ steps.identity.outputs.key_A }}
          NOTEGATE_DAST_API_KEY_B: ${{ steps.identity.outputs.key_B }}
          NOTEGATE_DAST_ACCOUNT_ID_A: ${{ steps.identity.outputs.account_A }}
          NOTEGATE_DAST_ACCOUNT_ID_B: ${{ steps.identity.outputs.account_B }}
        run: node deploy/ci/security-api.mjs

      - name: Probe malicious document rendering in a real browser
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        timeout-minutes: 6
        env:
          NOTEGATE_DAST_BROWSER_SESSION_A: ${{ steps.identity.outputs.session_A }}
        run: pnpm --filter web exec playwright test --config playwright.security.config.ts

      - name: Run bounded authenticated ZAP active scan
        if: ${{ !cancelled() && steps.app.outcome == 'success' && steps.api.outcome != 'skipped' }}
        timeout-minutes: 12
        env:
          NOTEGATE_DAST_API_KEY_A: ${{ steps.identity.outputs.key_A }}
        run: GITHUB_SHA="$SOURCE_SHA" node deploy/ci/security-zap.mjs

      - name: Publish sanitized findings
        if: always()
        run: |
          for report in security-results/summary-*.md; do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Retain sanitized evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-dast-pilot
          path: source/security-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop scanner and application
        if: always()
        run: |
          docker rm -f notegate-zap-pilot >/dev/null 2>&1 || true
          docker network rm notegate-dast >/dev/null 2>&1 || true
          if [ -f "$RUNNER_TEMP/security-api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/security-api.pid")" 2>/dev/null || true
          fi
