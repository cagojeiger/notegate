name: Text Write Performance

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Ancestor baseline commit or ref (empty uses the previous compatible published release)
        required: false
        type: string
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      base_ref:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  compare:
    name: Text Write Comparison
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notegate
          POSTGRES_PASSWORD: notegate
          POSTGRES_DB: notegate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notegate -d notegate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NOTEGATE_TEST_DATABASE_URL: postgres://notegate:notegate@localhost:5432/notegate
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable published baseline
        id: baseline
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || inputs.candidate_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$CANDIDATE_SHA" ]; then
            [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | python3 deploy/ci/resolve-text-write-baseline.py >> "$GITHUB_OUTPUT"
          cat text-write-results/baseline.md >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout baseline
        if: steps.baseline.outputs.sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.baseline.outputs.sha }}
          path: comparison-base
          persist-credentials: false

      - name: Cache cargo
        if: steps.baseline.outputs.sha != ''
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: text-write-performance
          workspaces: |
            . -> target/baseline
            . -> target/candidate

      - name: Compare baseline and candidate
        if: steps.baseline.outputs.sha != ''
        run: deploy/ci/compare-text-write.sh "$GITHUB_WORKSPACE/comparison-base"

      - name: Retain measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: text-write-performance
          path: text-write-results/
          if-no-files-found: warn
