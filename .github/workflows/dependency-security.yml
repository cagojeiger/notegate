name: Dependency Security
run-name: Core dependency-security ${{ fromJSON(inputs.request).run_id }}.${{ fromJSON(inputs.request).attempt }} ${{ fromJSON(inputs.request).tested_sha }}

on:
  workflow_dispatch:
    inputs:
      request:
        description: Validated core workflow run and immutable source request
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: core-dependency-security-${{ fromJSON(inputs.request).run_id }}-${{ fromJSON(inputs.request).attempt }}
  cancel-in-progress: false

jobs:
  gate:
    name: Validate core request
    permissions:
      contents: read
      actions: read
    if: github.repository == 'cagojeiger/notegate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested_sha: ${{ steps.request.outputs.tested_sha }}
      source_event: ${{ steps.request.outputs.source_event }}
      head_sha: ${{ steps.request.outputs.head_sha }}
      base_sha: ${{ steps.request.outputs.base_sha }}
      pr_number: ${{ steps.request.outputs.pr_number }}
      run_id: ${{ steps.request.outputs.run_id }}
      attempt: ${{ steps.request.outputs.attempt }}
      base_ref: ${{ steps.request.outputs.base_ref }}
      web_artifact_run_id: ${{ steps.request.outputs.web_artifact_run_id }}

    steps:
      - name: Create scoped core metadata token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read

      - name: Checkout trusted private CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          ref: ad63fe04543974b991d86afd7c350adf0e2a63b6
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Validate immutable core request
        id: request
        env:
          REQUEST_JSON: ${{ inputs.request }}
          GH_TOKEN: ${{ github.token }}
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
        run: python3 .control/.github/scripts/ci_bridge.py gate --kind dependency-security >> "$GITHUB_OUTPUT"

      - name: Revoke gate metadata token
        if: ${{ always() && steps.core-token.outputs.token != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
        run: bash .control/.github/scripts/checkout_core_revoke.sh

  rust-audit:
    permissions:
      contents: read
      actions: read
    needs: gate
    name: RustSec Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    env:
      SOURCE_EVENT: ${{ needs.gate.outputs.source_event }}

    steps:
      - name: Create scoped core metadata token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read

      - name: Checkout trusted private CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          ref: ad63fe04543974b991d86afd7c350adf0e2a63b6
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Validate current public CI worker
        id: worker
        uses: ./.control/.github/actions/ci-worker-entry
        with:
          request: ${{ inputs.request }}
          kind: dependency-security
          source-sha: ${{ needs.gate.outputs.tested_sha }}
          core-token: ${{ steps.core-token.outputs.token }}

      - name: Checkout exact core source
        uses: ./.control/.github/actions/checkout-core
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          sha: ${{ needs.gate.outputs.tested_sha }}
          path: source
          fetch-depth: 1

      - name: Install cargo-audit
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Audit Rust dependencies
        shell: private_run.sh {0}
        run: cargo audit --deny yanked

  npm-audit:
    permissions:
      contents: read
      actions: read
    needs: gate
    name: Npm Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Create scoped core metadata token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read

      - name: Checkout trusted private CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          ref: ad63fe04543974b991d86afd7c350adf0e2a63b6
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Validate current public CI worker
        id: worker
        uses: ./.control/.github/actions/ci-worker-entry
        with:
          request: ${{ inputs.request }}
          kind: dependency-security
          source-sha: ${{ needs.gate.outputs.tested_sha }}
          core-token: ${{ steps.core-token.outputs.token }}

      - name: Checkout exact core source
        uses: ./.control/.github/actions/checkout-core
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          sha: ${{ needs.gate.outputs.tested_sha }}
          path: source
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: source/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: source/.node-version
          package-manager-cache: false

      - name: Install dependencies without lifecycle scripts
        shell: private_run.sh {0}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit all npm dependencies
        shell: private_run.sh {0}
        run: pnpm audit --audit-level moderate
