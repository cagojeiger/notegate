name: Image Security
run-name: Core image-security ${{ fromJSON(inputs.request).run_id }}.${{ fromJSON(inputs.request).attempt }} ${{ fromJSON(inputs.request).tested_sha }}

on:
  workflow_dispatch:
    inputs:
      request:
        description: Validated core workflow run and immutable source request
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    name: Validate core request
    permissions:
      contents: read
      actions: read
    if: github.repository == 'cagojeiger/notegate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested_sha: ${{ steps.request.outputs.tested_sha }}
      source_event: ${{ steps.request.outputs.source_event }}
      head_sha: ${{ steps.request.outputs.head_sha }}
      base_sha: ${{ steps.request.outputs.base_sha }}
      pr_number: ${{ steps.request.outputs.pr_number }}
      run_id: ${{ steps.request.outputs.run_id }}
      attempt: ${{ steps.request.outputs.attempt }}
      base_ref: ${{ steps.request.outputs.base_ref }}
      web_artifact_run_id: ${{ steps.request.outputs.web_artifact_run_id }}

    steps:
      - name: Create scoped core metadata token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read

      - name: Checkout trusted private CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          ref: 30f64e4955b192832594ead97480d96caf3dd753
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Validate immutable core request
        id: request
        env:
          REQUEST_JSON: ${{ inputs.request }}
          GH_TOKEN: ${{ github.token }}
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
        run: python3 .control/.github/scripts/ci_bridge.py gate --kind image-security >> "$GITHUB_OUTPUT"

      - name: Revoke gate metadata token
        if: ${{ always() && steps.core-token.outputs.token != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
        run: bash .control/.github/scripts/checkout_core_revoke.sh

  image:
    permissions:
      contents: read
      actions: read
    needs: gate
    name: Resolve latest image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.image.outputs.ref }}
    steps:
      - name: Create scoped core metadata token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read

      - name: Checkout trusted private CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          ref: 30f64e4955b192832594ead97480d96caf3dd753
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Validate current public CI worker
        id: worker
        uses: ./.control/.github/actions/ci-worker-entry
        with:
          request: ${{ inputs.request }}
          kind: image-security
          core-token: ${{ steps.core-token.outputs.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      - name: Pin latest to its digest
        id: image
        env:
          IMAGE: ghcr.io/cagojeiger/notegate
        run: bash "$GITHUB_WORKSPACE/.control/.github/scripts/ci_image_security_resolve.sh"

  scan:
    name: Trivy linux/${{ matrix.arch }}
    needs: [gate, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Create scoped core metadata token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read

      - name: Checkout trusted private CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          ref: 30f64e4955b192832594ead97480d96caf3dd753
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Validate current public CI worker
        id: worker
        uses: ./.control/.github/actions/ci-worker-entry
        with:
          request: ${{ inputs.request }}
          kind: image-security
          core-token: ${{ steps.core-token.outputs.token }}

      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
          TRIVY_IMAGE_SRC: remote
        with:
          version: v0.74.0
          cache: false
          image-ref: ${{ needs.image.outputs.ref }}
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: trivy.json
          exit-code: "0"
          ignore-unfixed: false
          timeout: 10m

      - name: Prepare reports
        run: bash "$GITHUB_WORKSPACE/.control/.github/scripts/ci_image_security_reports.sh"

      - name: Upload scan reports
        if: ${{ steps.worker.outcome == 'success' && (always() && hashFiles('trivy.json') != '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-linux-${{ matrix.arch }}
          path: |
            trivy.json
            trivy.sarif
            trivy.txt
          retention-days: 30
          if-no-files-found: error

      - name: Alert on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
          TRIVY_IMAGE_SRC: remote
        with:
          version: v0.74.0
          cache: false
          image-ref: ${{ needs.image.outputs.ref }}
          scanners: vuln
          severity: CRITICAL
          format: table
          ignore-unfixed: true
          exit-code: "1"
          timeout: 10m

  report:
    name: Publish security findings
    needs: [gate, scan]
    if: ${{ always() && needs.gate.result == 'success' && needs.gate.outputs.source_event != 'pull_request' && needs.scan.result != 'cancelled' && needs.scan.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Create scoped core metadata token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read
          permission-actions: read
          permission-pull-requests: read

      - name: Checkout trusted private CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          ref: 30f64e4955b192832594ead97480d96caf3dd753
          token: ${{ steps.core-token.outputs.token }}
          path: .control
          fetch-depth: 1
          sparse-checkout: .github
          persist-credentials: false

      - name: Validate current public CI worker
        id: worker
        uses: ./.control/.github/actions/ci-worker-entry
        with:
          request: ${{ inputs.request }}
          kind: image-security
          core-token: ${{ steps.core-token.outputs.token }}

      - name: Download scan report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trivy-linux-${{ matrix.arch }}
      - name: Publish security findings
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-image-linux-${{ matrix.arch }}
