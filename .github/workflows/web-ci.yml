name: Web CI shadow

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full core main commit SHA
        required: true
        type: string
      source_ci_run_id:
        description: Completed core main push CI run
        required: true
        type: string
      source_ci_attempt:
        description: Exact completed CI attempt
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: web-shadow-${{ inputs.source_ci_run_id }}-${{ inputs.source_ci_attempt }}
  cancel-in-progress: false

jobs:
  gate:
    name: Validate source Web comparison
    if: github.repository == 'cagojeiger/notegate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      source_ci_run_id: ${{ steps.plan.outputs.source_ci_run_id }}
      source_ci_attempt: ${{ steps.plan.outputs.source_ci_attempt }}
      core_web_conclusion: ${{ steps.plan.outputs.core_web_conclusion }}
    steps:
      - name: Checkout trusted distribution gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Mint core read token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read
          permission-actions: read

      - name: Validate exact completed main Web job
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
          SOURCE_CI_ATTEMPT: ${{ inputs.source_ci_attempt }}
        run: python3 .github/scripts/web_ci.py >> "$GITHUB_OUTPUT"

  web:
    name: Web shadow
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    defaults:
      run:
        working-directory: source
    steps:
      - name: Mint checkout-only core token
        id: core-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.CORE_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORE_READ_APP_PRIVATE_KEY }}
          owner: cagojeiger
          repositories: notegate-core
          permission-contents: read
          skip-token-revoke: true

      - name: Checkout validated core source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cagojeiger/notegate-core
          ref: ${{ needs.gate.outputs.source_sha }}
          token: ${{ steps.core-token.outputs.token }}
          path: source
          persist-credentials: false

      - name: Revoke checkout token before executing source commands
        if: ${{ always() && steps.core-token.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        env:
          CORE_TOKEN: ${{ steps.core-token.outputs.token }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.request import Request, urlopen
          request = Request('https://api.github.com/installation/token', method='DELETE', headers={
              'Authorization': 'Bearer ' + os.environ['CORE_TOKEN'],
              'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10',
          })
          with urlopen(request, timeout=30) as response:
              assert response.status == 204, 'Checkout token could not be revoked'
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.29.3
          package_json_file: source/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      - name: Check theme contrast
        run: pnpm --filter web check:contrast

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Lint
        run: pnpm --filter web lint

      - name: Test
        run: pnpm --filter web test

      - name: Build
        run: pnpm --filter web build

      - name: Check production bundle budgets
        run: pnpm --filter web check:preview-bundle

  compare:
    name: Compare core and public Web results
    needs: [gate, web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout trusted comparison script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record comparison without changing core checks
        env:
          SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
          SOURCE_CI_RUN_ID: ${{ needs.gate.outputs.source_ci_run_id }}
          SOURCE_CI_ATTEMPT: ${{ needs.gate.outputs.source_ci_attempt }}
          CORE_RESULT: ${{ needs.gate.outputs.core_web_conclusion }}
          PUBLIC_RESULT: ${{ needs.web.result }}
          GATE_RESULT: ${{ needs.gate.result }}
        run: python3 .github/scripts/web_ci.py --compare >> "$GITHUB_STEP_SUMMARY"
