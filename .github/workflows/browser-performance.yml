name: Browser Performance
run-name: Core browser-performance ${{ fromJSON(inputs.request).run_id }}.${{ fromJSON(inputs.request).attempt }} ${{ fromJSON(inputs.request).tested_sha }}

on:
  workflow_dispatch:
    inputs:
      request:
        description: Validated core workflow run and immutable source request
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  gate:
    name: Validate core request
    permissions:
      contents: read
      actions: read
    if: github.repository == 'cagojeiger/notegate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested_sha: ${{ steps.request.outputs.tested_sha }}
      source_event: ${{ steps.request.outputs.source_event }}
      head_sha: ${{ steps.request.outputs.head_sha }}
      base_sha: ${{ steps.request.outputs.base_sha }}
      pr_number: ${{ steps.request.outputs.pr_number }}
      run_id: ${{ steps.request.outputs.run_id }}
      attempt: ${{ steps.request.outputs.attempt }}
      base_ref: ${{ steps.request.outputs.base_ref }}
      web_artifact_run_id: ${{ steps.request.outputs.web_artifact_run_id }}

    steps:
      - name: Checkout trusted public control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .control
          persist-credentials: false

      - name: Validate immutable core request
        id: request
        env:
          REQUEST_JSON: ${{ inputs.request }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .control/.github/scripts/ci_bridge.py gate --kind browser-performance >> "$GITHUB_OUTPUT"

  baseline:
    needs: gate
    name: Authenticated Browser Baseline
    defaults:
      run:
        working-directory: source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notegate
          POSTGRES_PASSWORD: notegate
          POSTGRES_DB: notegate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notegate -d notegate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NOTEGATE_DATABASE_URL: postgres://notegate:notegate@localhost:5432/notegate
      # Exercise local sessions/grants; CI has no live identity-provider dependency.
      NOTEGATE_OIDC__ISSUER: http://127.0.0.1:9192
      NOTEGATE_OIDC__CLIENT_ID: notegate-web
      NOTEGATE_PUBLIC_URL: http://127.0.0.1:9191
      NOTEGATE_CLI_OAUTH_CLIENT_ID: notegate-cli-local
      NOTEGATE_ENC_ROOT_KEY_ID: e2e-enc
      NOTEGATE_ENC_ROOT_SECRET: e2e-distinct-enc-root-secret-32-bytes
      NOTEGATE_LOOKUP_ROOT_KEY_ID: e2e-lookup
      NOTEGATE_LOOKUP_ROOT_SECRET: e2e-distinct-lookup-root-secret-32b
      NOTEGATE_S3__ENDPOINT: http://127.0.0.1:9000
      NOTEGATE_S3__PUBLIC_ENDPOINT: http://127.0.0.1:9000
      NOTEGATE_S3__REGION: us-east-1
      NOTEGATE_S3__BUCKET: notegate-e2e
      NOTEGATE_S3__ACCESS_KEY: notegate-app
      NOTEGATE_S3__SECRET_KEY: notegate-app-secret
      NOTEGATE_S3__FORCE_PATH_STYLE: "true"

      NOTEGATE_WEB_DIST_DIR: ${{ github.workspace }}/source/frontend/web/dist

    steps:
      - name: Checkout trusted public control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .control
          persist-credentials: false

      - name: Checkout exact public core source
        uses: ./.control/.github/actions/checkout-core
        with:
          sha: ${{ needs.gate.outputs.tested_sha }}
          path: source
          fetch-depth: 1

      - name: Record candidate
        run: echo "BROWSER_MEASUREMENT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Download frontend from the originating CI run
        if: needs.gate.outputs.web_artifact_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: source/frontend/web/dist
          github-token: ${{ github.token }}
          run-id: ${{ needs.gate.outputs.web_artifact_run_id }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: source/package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: source/.node-version
          package-manager-cache: false

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web exec playwright install --with-deps chromium

      - name: Build production frontend for manual measurement
        if: needs.gate.outputs.web_artifact_run_id == ''
        run: pnpm --filter web build

      - name: Build release backend
        run: cargo build --locked --release --package notegate-api --bin notegate-api --example seed_user

      - name: Measure Lighthouse on the production frontend
        run: pnpm --filter web test:lighthouse:built

      - name: Start MinIO
        env:
          NOTEGATE_S3_BUCKET: ${{ env.NOTEGATE_S3__BUCKET }}
          NOTEGATE_S3_ACCESS_KEY: ${{ env.NOTEGATE_S3__ACCESS_KEY }}
          NOTEGATE_S3_SECRET_KEY: ${{ env.NOTEGATE_S3__SECRET_KEY }}
        run: bash deploy/ci/start-minio.sh

      - name: Seed disposable identity
        id: identity
        run: |
          output=$(target/release/examples/seed_user)
          key=$(printf '%s\n' "$output" | sed -n 's/^AGENT_API_KEY=//p')
          session=$(printf '%s\n' "$output" | sed -n 's/^BROWSER_SESSION=//p')
          test -n "$key"
          test -n "$session"
          echo "::add-mask::$key"
          echo "::add-mask::$session"
          {
            echo "api_key=$key"
            echo "browser_session=$session"
          } >> "$GITHUB_OUTPUT"

      - name: Start application
        run: |
          target/release/notegate-api >"$RUNNER_TEMP/browser-performance-api.log" 2>&1 &
          api_pid=$!
          echo "$api_pid" >"$RUNNER_TEMP/browser-performance-api.pid"
          for _ in $(seq 1 60); do
            kill -0 "$api_pid" || { cat "$RUNNER_TEMP/browser-performance-api.log"; exit 1; }
            if curl --fail --silent http://127.0.0.1:9191/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/browser-performance-api.log"
          exit 1

      - name: Measure authenticated browser journeys
        timeout-minutes: 5
        env:
          NOTEGATE_WEB_E2E_BROWSER_SESSION: ${{ steps.identity.outputs.browser_session }}
          NOTEGATE_PUBLIC_V2_API_KEY: ${{ steps.identity.outputs.api_key }}
        run: |
          pnpm --filter web exec playwright test --config playwright.performance.config.ts workbench.spec.ts
          kill -0 "$(cat "$RUNNER_TEMP/browser-performance-api.pid")"

      - name: Publish summary
        if: always()
        run: |
          report=frontend/web/test-results/browser-performance/summary.md
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain baseline, including partial failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-performance
          path: |
            source/frontend/web/test-results/browser-performance/
            source/frontend/web/lighthouse-reports/
          if-no-files-found: warn
          retention-days: 7
