name: Browser Performance

on:
  workflow_dispatch:
    inputs:
      web_artifact_run_id:
        description: Successful main CI run providing web-dist (empty builds locally)
        required: false
        type: string
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      web_artifact_run_id:
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  baseline:
    name: Authenticated Browser Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notegate
          POSTGRES_PASSWORD: notegate
          POSTGRES_DB: notegate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notegate -d notegate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NOTEGATE_DATABASE_URL: postgres://notegate:notegate@localhost:5432/notegate
      # Exercise local sessions/grants; CI has no live identity-provider dependency.
      NOTEGATE_OIDC__ISSUER: http://127.0.0.1:9192
      NOTEGATE_OIDC__CLIENT_ID: notegate-web
      NOTEGATE_PUBLIC_URL: http://127.0.0.1:9191
      NOTEGATE_CLI_OAUTH_CLIENT_ID: notegate-cli-local
      NOTEGATE_ENC_ROOT_KEY_ID: e2e-enc
      NOTEGATE_ENC_ROOT_SECRET: e2e-distinct-enc-root-secret-32-bytes
      NOTEGATE_LOOKUP_ROOT_KEY_ID: e2e-lookup
      NOTEGATE_LOOKUP_ROOT_SECRET: e2e-distinct-lookup-root-secret-32b
      NOTEGATE_S3__ENDPOINT: http://127.0.0.1:9000
      NOTEGATE_S3__PUBLIC_ENDPOINT: http://127.0.0.1:9000
      NOTEGATE_S3__REGION: us-east-1
      NOTEGATE_S3__BUCKET: notegate-e2e
      NOTEGATE_S3__ACCESS_KEY: notegate-app
      NOTEGATE_S3__SECRET_KEY: notegate-app-secret
      NOTEGATE_S3__FORCE_PATH_STYLE: "true"

      NOTEGATE_WEB_DIST_DIR: ${{ github.workspace }}/frontend/web/dist

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || inputs.candidate_sha }}
          persist-credentials: false

      - name: Verify candidate and frontend artifact producer
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || inputs.candidate_sha }}
          WEB_ARTIFACT_RUN_ID: ${{ inputs.web_artifact_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "BROWSER_MEASUREMENT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if [ -n "$CANDIDATE_SHA" ]; then
            [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          fi
          if [ -n "$WEB_ARTIFACT_RUN_ID" ]; then
            [[ "$WEB_ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WEB_ARTIFACT_RUN_ID" \
              > "$RUNNER_TEMP/web-artifact-run.json"
            jq -e --arg sha "$(git rev-parse HEAD)" --arg repo "$GITHUB_REPOSITORY" '
              .head_sha == $sha and .head_repository.full_name == $repo and
              .event == "push" and .head_branch == "main" and
              .conclusion == "success" and (.path | split("@")[0]) == ".github/workflows/ci.yml"
            ' "$RUNNER_TEMP/web-artifact-run.json" >/dev/null
          fi

      - name: Download frontend from the originating CI run
        if: inputs.web_artifact_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: frontend/web/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.web_artifact_run_id }}

      - name: Cache release build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: browser-performance-release
          cache-on-failure: true

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web exec playwright install --with-deps chromium

      - name: Build production frontend for manual measurement
        if: inputs.web_artifact_run_id == ''
        run: pnpm --filter web build

      - name: Build release backend
        run: cargo build --locked --release --package notegate-api --bin notegate-api --example seed_user

      - name: Measure Lighthouse on the production frontend
        run: pnpm --filter web test:lighthouse:built

      - name: Start MinIO
        env:
          NOTEGATE_S3_BUCKET: ${{ env.NOTEGATE_S3__BUCKET }}
          NOTEGATE_S3_ACCESS_KEY: ${{ env.NOTEGATE_S3__ACCESS_KEY }}
          NOTEGATE_S3_SECRET_KEY: ${{ env.NOTEGATE_S3__SECRET_KEY }}
        run: bash deploy/ci/start-minio.sh

      - name: Seed disposable identity
        id: identity
        run: |
          output=$(target/release/examples/seed_user)
          key=$(printf '%s\n' "$output" | sed -n 's/^AGENT_API_KEY=//p')
          session=$(printf '%s\n' "$output" | sed -n 's/^BROWSER_SESSION=//p')
          test -n "$key"
          test -n "$session"
          echo "::add-mask::$key"
          echo "::add-mask::$session"
          {
            echo "api_key=$key"
            echo "browser_session=$session"
          } >> "$GITHUB_OUTPUT"

      - name: Start application
        run: |
          target/release/notegate-api >"$RUNNER_TEMP/browser-performance-api.log" 2>&1 &
          api_pid=$!
          echo "$api_pid" >"$RUNNER_TEMP/browser-performance-api.pid"
          for _ in $(seq 1 60); do
            kill -0 "$api_pid" || { cat "$RUNNER_TEMP/browser-performance-api.log"; exit 1; }
            if curl --fail --silent http://127.0.0.1:9191/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/browser-performance-api.log"
          exit 1

      - name: Measure authenticated browser journeys
        timeout-minutes: 5
        env:
          NOTEGATE_WEB_E2E_BROWSER_SESSION: ${{ steps.identity.outputs.browser_session }}
          NOTEGATE_PUBLIC_V2_API_KEY: ${{ steps.identity.outputs.api_key }}
        run: |
          pnpm --filter web exec playwright test --config playwright.performance.config.ts workbench.spec.ts
          kill -0 "$(cat "$RUNNER_TEMP/browser-performance-api.pid")"

      - name: Publish summary
        if: always()
        run: |
          report=frontend/web/test-results/browser-performance/summary.md
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain baseline, including partial failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-performance
          path: |
            frontend/web/test-results/browser-performance/
            frontend/web/lighthouse-reports/
          if-no-files-found: warn
          retention-days: 7
