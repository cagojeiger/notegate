name: Set up pinned local security scanners
description: Install local scanners and a fixed official rule bundle without product source
runs:
  using: composite
  steps:
    - name: Checkout pinned scanner rules
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: semgrep/semgrep-rules
        ref: 16b9e6d45f10649f6a531ec4838ed9924372c3bc
        path: .rules
        persist-credentials: false

    - name: Install pinned local scanners
      shell: bash
      run: |
        set -euo pipefail
        python3 -m venv "$RUNNER_TEMP/security-tools"
        "$RUNNER_TEMP/security-tools/bin/pip" install --disable-pip-version-check semgrep==1.182.0
        curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/security-tools/bin" gitleaks
        echo "$RUNNER_TEMP/security-tools/bin" >> "$GITHUB_PATH"
