global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: notegate
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - api
          - worker
          - reconciler
        type: A
        port: 9191
        refresh_interval: 5s
      - names:
          - search
        type: A
        port: 9192
        refresh_interval: 5s
    relabel_configs:
      - source_labels:
          - __meta_dns_name
        target_label: scrape_role
